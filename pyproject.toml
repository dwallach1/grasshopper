[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesisforge"
version = "0.1.0"
description = "Composable research and trading support tools"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.4"]

[project.scripts]
thesisforge = "thesisforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
